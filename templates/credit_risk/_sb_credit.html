<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        /* ── Sidebar — Charcoal & Brass ── */
        --sb-bg:          #100D0B;
        --sb-link:        rgba(237,230,217,.45);
        --sb-hover:       rgba(237,230,217,.88);
        --sb-active-bg:   rgba(201,162,75,.14);
        --sb-active:      #D4AF5A;
        --sb-border:      rgba(201,162,75,.09);
        --sb-section:     rgba(201,162,75,.34);
        --sb-hover-bg:    rgba(201,162,75,.06);
        --sb-btn-bg:      rgba(201,162,75,.06);
        --sb-btn-border:  rgba(201,162,75,.15);
        --sb-btn-color:   rgba(201,162,75,.42);
        --sb-btn-bg2:     rgba(201,162,75,.14);
        --sb-btn-color2:  rgba(237,230,217,.78);
        --sb-avatar-bg:   rgba(201,162,75,.16);
        --sb-avatar-text: rgba(237,230,217,.9);
        --sb-user-name:   rgba(237,230,217,.86);
        --sb-user-meta:   rgba(201,162,75,.42);
        --sb-mob-text:    rgba(237,230,217,.8);
        --sb-brand-mark:  #C9A24B;
        --sb-brand-name:  rgba(237,230,217,.94);

        /* ── Content — Charcoal & Brass ── */
        --page-bg:  #15120F;
        --card-bg:  #1C1815;
        --border:   #332C24;
        --text:     #EDE6D9;
        --muted:    #A79C89;
        --accent:   #C9A24B;
        --accent-h: #E4C878;

        /* ── Vault-specific tokens ── */
        --cr-bg-2:        #0F0D0B;
        --cr-surface-2:   #241F1A;
        --cr-border-soft: #2A241D;
        --cr-brass:        #C9A24B;
        --cr-brass-bright: #E4C878;
        --cr-brass-dim:    #9C7D3E;
        --cr-tarnish:        #7A4A3A;
        --cr-tarnish-bright: #B5543E;
        --cr-patina:        #7C9070;
        --cr-patina-bright: #9BB58C;
        --cr-ink-dim:      #6B6156;
        --font-display: 'Fraunces', Georgia, serif;
        --font-ui: 'Archivo', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    /* .fs-sidebar's background is hardcoded to a navy gradient in base.html
       and never actually reads --sb-bg (true across every themed section,
       just invisible elsewhere because their content stays light). Override
       it directly here so the sidebar reads as the same charcoal material
       as the page, not a leftover navy panel bolted onto it. */
    .fs-sidebar {
        background: linear-gradient(175deg, #1A130A 0%, #0A0704 100%);
    }

    /* ── Page-level texture: faint brushed-metal noise + vignette ── */
    body:has(.cr-shell) {
        background-image:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,75,.05), transparent 60%),
            repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px);
    }

    .cr-shell { font-family: var(--font-ui); animation: crRise .5s cubic-bezier(.16,1,.3,1) both; }
    .cr-shell .display, .cr-shell h1, .cr-shell h2, .cr-shell h3, .cr-shell h4 {
        font-family: var(--font-display);
    }
    .cr-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    @keyframes crRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .cr-stagger > * { opacity: 0; animation: crRise .5s cubic-bezier(.16,1,.3,1) forwards; }
    .cr-stagger > *:nth-child(1) { animation-delay: .03s; }
    .cr-stagger > *:nth-child(2) { animation-delay: .08s; }
    .cr-stagger > *:nth-child(3) { animation-delay: .13s; }
    .cr-stagger > *:nth-child(4) { animation-delay: .18s; }
    .cr-stagger > *:nth-child(5) { animation-delay: .23s; }
    .cr-stagger > *:nth-child(6) { animation-delay: .28s; }
    .cr-stagger > *:nth-child(n+7) { animation-delay: .32s; }

    /* ── Eyebrow label ── */
    .cr-eyebrow {
        font-family: var(--font-mono);
        font-size: .66rem;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--cr-brass);
        display: flex; align-items: center; gap: 8px;
    }
    .cr-eyebrow::before { content: ''; width: 14px; height: 1px; background: var(--cr-brass-dim); }

    /* ── Cards: hairline border + brass sheen sweep on hover ── */
    .fs-main .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
    }
    .fs-main .card::before {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(115deg, transparent 40%, rgba(201,162,75,.05) 50%, transparent 60%);
        transform: translateX(-100%);
        transition: transform .7s ease;
        pointer-events: none;
    }
    .fs-main .card:hover::before { transform: translateX(100%); }
    .fs-main .card-header {
        background: var(--cr-surface-2);
        color: var(--cr-brass);
        border-bottom: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: .7rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        font-weight: 500;
    }

    /* ── Tables: ledger styling ── */
    .fs-main .table {
        --bs-table-bg: transparent;
        --bs-table-color: var(--text);
        --bs-table-striped-bg: var(--cr-surface-2);
        --bs-table-hover-bg: var(--cr-surface-2);
        --bs-table-hover-color: var(--text);
        --bs-table-border-color: var(--cr-border-soft);
        color: var(--text);
    }
    .fs-main .table thead.table-dark th {
        background: var(--cr-surface-2);
        color: var(--cr-brass);
        border-bottom: 1px solid var(--cr-border-soft);
    }
    .fs-main .table td, .fs-main .table th { border-color: var(--cr-border-soft); }
    .fs-main .table-hover > tbody > tr { transition: background .18s ease; }
    .fs-main .table-hover > tbody > tr:hover > td { background: var(--cr-surface-2); }
    .fs-main .table-bordered { border-color: var(--cr-border-soft); }

    /* ── Forms ── */
    .fs-main .form-control, .fs-main .form-select {
        background: var(--cr-bg-2);
        border-color: var(--border);
        color: var(--text);
    }
    .fs-main .form-control:focus, .fs-main .form-select:focus {
        background: var(--cr-bg-2);
        border-color: var(--cr-brass);
        color: var(--text);
        box-shadow: 0 0 0 3px rgba(201,162,75,.14);
    }
    .fs-main .form-control::placeholder { color: var(--cr-ink-dim); }
    .fs-main .form-label {
        font-family: var(--font-mono);
        font-size: .68rem;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .fs-main input[type="file"]::file-selector-button {
        background: var(--cr-surface-2);
        color: var(--cr-brass);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-family: var(--font-ui);
        font-size: .8rem;
        margin-right: 10px;
        cursor: pointer;
        transition: background .15s ease;
    }
    .fs-main input[type="file"]::file-selector-button:hover { background: var(--cr-border-soft); }

    /* ── Buttons ── */
    .fs-main .btn-primary {
        background: linear-gradient(180deg, var(--cr-brass-bright), var(--cr-brass));
        border-color: var(--cr-brass-dim);
        color: #1A1510;
        font-weight: 600;
        text-shadow: 0 1px 0 rgba(255,255,255,.15);
    }
    .fs-main .btn-primary:hover {
        background: linear-gradient(180deg, #F0DA9C, var(--cr-brass-bright));
        border-color: var(--cr-brass);
        color: #1A1510;
    }
    .fs-main .btn-outline-primary { color: var(--cr-brass); border-color: var(--cr-brass-dim); }
    .fs-main .btn-outline-primary:hover { background: var(--cr-brass); border-color: var(--cr-brass); color: #1A1510; }
    .fs-main .btn-outline-secondary { color: var(--muted); border-color: var(--border); }
    .fs-main .btn-outline-secondary:hover { background: var(--cr-surface-2); color: var(--text); border-color: var(--border); }
    .fs-main .btn-outline-danger { color: var(--cr-tarnish-bright); border-color: var(--cr-tarnish); }
    .fs-main .btn-outline-danger:hover { background: var(--cr-tarnish); color: #F5E4DC; border-color: var(--cr-tarnish); }
    .fs-main .btn-danger { background: var(--cr-tarnish-bright); border-color: var(--cr-tarnish-bright); }

    /* ── Badges: polished / aged / tarnished (not stoplight) ── */
    .cr-badge {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: var(--font-mono);
        font-size: .68rem; font-weight: 500;
        letter-spacing: .05em; text-transform: uppercase;
        padding: 3px 9px 3px 7px;
        border-radius: 100px;
        border: 1px solid transparent;
    }
    .cr-badge::before { content:''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cr-badge-polished { background: rgba(228,200,120,.12); color: var(--cr-brass-bright); border-color: rgba(228,200,120,.3); }
    .cr-badge-polished::before { background: var(--cr-brass-bright); box-shadow: 0 0 6px rgba(228,200,120,.7); }
    .cr-badge-aged { background: rgba(156,125,62,.12); color: var(--cr-brass-dim); border-color: rgba(156,125,62,.35); }
    .cr-badge-aged::before { background: var(--cr-brass-dim); }
    .cr-badge-tarnished { background: rgba(181,84,62,.12); color: var(--cr-tarnish-bright); border-color: rgba(181,84,62,.35); }
    .cr-badge-tarnished::before { background: var(--cr-tarnish-bright); }
    .cr-badge-neutral { background: rgba(167,156,137,.1); color: var(--muted); border-color: var(--cr-border-soft); }
    .cr-badge-neutral::before { background: var(--muted); }

    /* ── Alerts, restrained to the vault palette ── */
    .fs-main .alert { border-radius: 8px; }
    .fs-main .alert-success { background: rgba(124,144,112,.12); color: var(--cr-patina-bright); border-color: rgba(124,144,112,.3); }
    .fs-main .alert-danger  { background: rgba(181,84,62,.12); color: var(--cr-tarnish-bright); border-color: rgba(181,84,62,.32); }
    .fs-main .alert-warning { background: rgba(201,162,75,.12); color: var(--cr-brass-bright); border-color: rgba(201,162,75,.3); }
    .fs-main .alert-secondary, .fs-main .alert-info { background: var(--cr-surface-2); color: var(--text); border-color: var(--border); }
    .fs-main .btn-close { filter: invert(1) grayscale(1) brightness(1.6); }

    /* ── Misc component reskins ── */
    .fs-main .list-group-item { background: var(--card-bg); color: var(--text); border-color: var(--border); }
    .fs-main .list-group-item-action:hover { background: var(--cr-surface-2); color: var(--cr-brass-bright); }
    .fs-main .pagination .page-link { background: var(--card-bg); border-color: var(--border); color: var(--text); }
    .fs-main .pagination .page-item.disabled .page-link { color: var(--cr-ink-dim); background: var(--card-bg); }
    .fs-main .pagination .page-item.active .page-link { background: var(--cr-brass); border-color: var(--cr-brass); color: #1A1510; }
    .fs-main .nav-pills .nav-link { color: var(--muted); }
    .fs-main .nav-pills .nav-link.active { background: var(--cr-brass); color: #1A1510; }
    .fs-main .text-muted { color: var(--muted) !important; }

    /* ── Vault spinner: rotating brass ring, replaces Bootstrap's spinner-border ── */
    .cr-vault-spinner {
        width: 54px; height: 54px;
        border-radius: 50%;
        border: 3px solid var(--cr-border-soft);
        border-top-color: var(--cr-brass);
        border-right-color: var(--cr-brass-dim);
        animation: crSpin 1.1s linear infinite;
        margin: 0 auto;
    }
    @keyframes crSpin { to { transform: rotate(360deg); } }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed — Ferrite Steel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: #EFE9DA; }
        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: #EFE9DA;
            background-image: radial-gradient(circle, rgba(34,25,18,.05) 1px, transparent 1px);
            background-size: 26px 26px;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .sheet { width: 100%; max-width: 400px; animation: cardIn .32s ease both; }
        .sheet-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 0 4px; }
        .sheet-brand .mark {
            width: 30px; height: 30px; background: #B8481B; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Big Shoulders Display', sans-serif; font-size: .72rem; font-weight: 700; color: #fff;
        }
        .sheet-brand .name { font-family: 'Big Shoulders Display', sans-serif; font-size: 1.02rem; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; color: #221D18; }
        .sheet-brand .sys { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: .64rem; letter-spacing: .06em; color: #A79A89; text-transform: uppercase; }
        .cert {
            position: relative; background: #FFFDF8; border: 1px solid #DED4BC;
            border-top: 4px solid #3F7D52; padding: 30px 28px 26px; text-align: center;
            box-shadow: 0 1px 2px rgba(34,25,18,.05), 0 18px 40px -14px rgba(34,25,18,.16);
        }
        .cert::before, .cert::after { content: ''; position: absolute; width: 9px; height: 9px; }
        .cert::before { top: -1px; left: -1px; border-top: 2px solid #221D18; border-left: 2px solid #221D18; }
        .cert::after  { top: -1px; right: -1px; border-top: 2px solid #221D18; border-right: 2px solid #221D18; }
        .cert-icon {
            width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 14px;
            background: #EAF4EC; color: #3F7D52; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
        }
        .cert h1 { font-family: 'Big Shoulders Display', sans-serif; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; color: #221D18; margin-bottom: 8px; }
        .cert-sub { color: #7C7167; font-size: .83rem; margin-bottom: 22px; line-height: 1.6; }
        .cert-submit {
            display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px;
            background: #221D18; border: none; font-family: 'Manrope', sans-serif; font-size: .86rem; font-weight: 700;
            padding: 11px 16px; border-radius: 6px; color: #F5EFE4; cursor: pointer; text-decoration: none;
            transition: background .15s, transform .08s ease;
        }
        .cert-submit:hover { background: #B8481B; color: #F5EFE4; text-decoration: none; }
        .cert-submit:active { transform: scale(.98); }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="sheet-brand">
            <div class="mark">FS</div>
            <div class="name">Ferrite Steel</div>
            <div class="sys">Account recovery</div>
        </div>
        <div class="cert">
            <div class="cert-icon"><i class="bi bi-check2-circle"></i></div>
            <h1>Password updated</h1>
            <p class="cert-sub">Your password has been changed successfully.<br>You can now sign in with your new password.</p>
            <a href="{% url 'login' %}" class="cert-submit">Sign in <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
</body>
</html>
